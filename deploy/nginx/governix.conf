# Governix main site: the Master Admin portal on port 80.
# Each organization's own port is written by the app (Organizations > Nginx) into
# /etc/nginx/governix-tenants/, which governix-tenants.conf includes.
#
# Install: sudo cp deploy/nginx/governix.conf /etc/nginx/sites-available/governix.conf
#          sudo ln -s /etc/nginx/sites-available/governix.conf /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/governix/frontend/dist;
    index index.html;

    # MAX_UPLOAD_SIZE_MB (1024) + 1 for the multipart envelope.
    client_max_body_size 1025m;

    # Compress the app and JSON. text/event-stream is left out: compressing it would hold back streamed answers.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The browser calls /api/...; FastAPI serves the same paths without the prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers stream as server-sent events, and uploads go straight through.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Built files carry a content hash in their names, so a browser may keep them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path loads index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always checked again, so a redeploy's new file names are picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
